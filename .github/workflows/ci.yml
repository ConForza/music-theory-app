name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, validate curriculum, check generated docs, run tests
        run: npm run check
      - name: Release gate (informational — expected to fail until teacher sign-off)
        run: npm run validate:release
        continue-on-error: true
