name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, validate curriculum, check generated docs, run tests, build
        run: npm run check
      - name: Release gate (informational — expected to fail until teacher sign-off)
        run: npm run validate:release
        continue-on-error: true

  browser:
    runs-on: ubuntu-latest
    needs: curriculum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys (Brief 02 app, Brief 02 follow-up, Brief 03 exercise engine, Grades 1 to 4; phone, small phone, tablet, desktop, keyboard, dark, zoom)
        run: npm run e2e
