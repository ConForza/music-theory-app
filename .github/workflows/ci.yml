name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, validate curriculum, check generated docs, run tests, build
        run: npm run check
      - name: Practice-examination coverage audit (every outcome in every paper, variation, placement probes)
        run: npm run audit:prep -w @mtp/api
      - name: Release gate (informational — expected to fail until teacher sign-off)
        run: npm run validate:release
        continue-on-error: true

  # Each browser shard starts independently of curriculum and has its own runner,
  # built app, Chromium and temporary SQLite database. Shards cover the same real-browser
  # suites as the serial npm run e2e command (the ten earlier suites plus Brief 10's
  # placement, practice-examination and revision journeys in the `prep` shard).
  browser_shard:
    name: browser / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [foundation, early, advanced, grade5, prep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys (${{ matrix.shard }})
        run: npm run e2e:${{ matrix.shard }} -w @mtp/web

  # Preserve the existing required "browser" status check, but fail it when ANY
  # shard fails or is cancelled. Do not skip just because a shard fails.
  browser:
    runs-on: ubuntu-latest
    needs: browser_shard
    if: always()
    steps:
      - name: Require all browser shards to pass
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: |
          echo "Browser shards: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"
